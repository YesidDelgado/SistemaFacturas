<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Facturas</title>

    <link rel="stylesheet" href="/static/css/estilos.css">
    <script src="/static/js/app.js" defer></script>
</head>

<body>
    <main class="contenedor">
        <header class="encabezado">
            <div>
                <h1>Sistema de Facturas</h1>
                <p>Registro y administración de facturas</p>
            </div>

            <span id="estado-api">Conectando...</span>
        </header>

        <section class="resumen">
            <article class="tarjeta">
                <span>Total de facturas</span>
                <strong id="total-facturas">0</strong>
            </article>

            <article class="tarjeta">
                <span>Valor acumulado</span>
                <strong id="valor-total">$0</strong>
            </article>
        </section>

        <section class="panel">
            <h2 id="titulo-formulario">Registrar factura</h2>

            <form id="form-factura">
                <div class="campo">
                    <label for="factura">Código de factura</label>
                    <input
                        type="text"
                        id="factura"
                        value="Cargando..."
                        readonly
                    >
                    <small>Este código se genera automáticamente.</small>
                </div>

                <div class="campo">
                    <label for="cliente">Cliente</label>
                    <input
                        type="text"
                        id="cliente"
                        maxlength="150"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="fecha">Fecha</label>
                    <input
                        type="date"
                        id="fecha"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="total">Total</label>
                    <input
                        type="number"
                        id="total"
                        min="0"
                        step="0.01"
                        required
                    >
                </div>

                <div class="acciones-formulario">
                    <button type="submit" id="btn-guardar">
                        Guardar factura
                    </button>

                    <button
                        type="button"
                        id="btn-cancelar"
                        class="secundario"
                        hidden
                    >
                        Cancelar edición
                    </button>
                </div>
            </form>

            <p id="mensaje" role="status"></p>
        </section>

        <section class="panel">
            <div class="encabezado-tabla">
                <h2>Facturas registradas</h2>

                <input
                    type="search"
                    id="buscar"
                    placeholder="Buscar por código o cliente..."
                    aria-label="Buscar factura"
                >
            </div>

            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Cliente</th>
                            <th>Fecha</th>
                            <th>Total</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="tabla-facturas">
                        <tr>
                            <td colspan="5">Cargando facturas...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
